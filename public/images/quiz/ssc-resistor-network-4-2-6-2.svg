<svg width="100%" height="100%" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="R1 4 ohm, R2 2 ohm, R3 6 ohm, R4 2 ohm with 12 volt source">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .wire{stroke:#0f172a;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .res{stroke:#2563eb;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,'Noto Sans Bengali',sans-serif;font-size:25px;font-weight:800;fill:#0f172a}
      .small{font-family:Arial,'Noto Sans Bengali',sans-serif;font-size:20px;font-weight:700;fill:#334155}
      .node{fill:#ea580c;stroke:#fff;stroke-width:4}
    </style>
  </defs>
  <rect width="900" height="520" rx="26" fill="#f8fafc"/>
  <rect x="38" y="38" width="824" height="444" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="450" y="86" text-anchor="middle" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">প্রদর্শিত বর্তনী</text>
  <g class="wire">
    <line x1="130" y1="260" x2="190" y2="260"/>
    <line x1="380" y1="260" x2="430" y2="260"/>
    <line x1="430" y1="180" x2="430" y2="340"/>
    <line x1="645" y1="180" x2="645" y2="340"/>
    <line x1="645" y1="260" x2="690" y2="260"/>
    <line x1="815" y1="260" x2="815" y2="420"/>
    <line x1="815" y1="420" x2="130" y2="420"/>
    <line x1="130" y1="420" x2="130" y2="260"/>
  </g>
  <path class="res" d="M190 260 h30 l14 -20 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -20 h30"/>
  <path class="res" d="M430 180 h35 l14 -20 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -20 h34"/>
  <path class="res" d="M430 340 h35 l14 -20 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -20 h34"/>
  <path class="res" d="M690 260 h22 l14 -20 l14 40 l14 -40 l14 40 l14 -40 l14 40 l14 -20 h25"/>
  <g class="wire">
    <line x1="120" y1="320" x2="150" y2="320"/>
    <line x1="128" y1="344" x2="142" y2="344"/>
  </g>
  <circle cx="430" cy="260" r="8" class="node"/><text x="412" y="292" class="small" font-family="Noto Sans Bengali, Arial, sans-serif">B</text>
  <circle cx="645" cy="260" r="8" class="node"/><text x="655" y="292" class="small" font-family="Noto Sans Bengali, Arial, sans-serif">C</text>
  <text x="285" y="230" text-anchor="middle" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">R₁ = 4Ω</text>
  <text x="538" y="150" text-anchor="middle" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">R₂ = 2Ω</text>
  <text x="538" y="388" text-anchor="middle" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">R₃ = 6Ω</text>
  <text x="755" y="230" text-anchor="middle" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">R₄ = 2Ω</text>
  <text x="164" y="355" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">V = 12V</text>
  <text x="538" y="456" text-anchor="middle" class="small" font-family="Noto Sans Bengali, Arial, sans-serif">R₂ ও R₃ সমান্তরাল; এই সমবায়টি R₁ ও R₄-এর সাথে শ্রেণিতে যুক্ত</text>
</svg>
