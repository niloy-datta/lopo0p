      .plus { font-family:Arial, sans-serif; font-size:34px; font-weight:900; fill:#dc2626; }
      .minus { font-family:Arial, sans-serif; font-size:34px; font-weight:900; fill:#2563eb; }
      .dim { stroke:#ea580c; stroke-width:3; fill:none; marker-start:url(#arrow); marker-end:url(#arrow); }
      .force { stroke:#16a34a; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="520" rx="26" fill="url(#bg)"/>
