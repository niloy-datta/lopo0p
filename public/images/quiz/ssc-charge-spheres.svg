  <text x="250" y="390" text-anchor="middle" class="label" font-family="Noto Sans Bengali, Arial, sans-serif">A</text>
  <circle cx="650" cy="270" r="78" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="650" y="282" text-anchor="middle" class="minus" font-family="Noto Sans Bengali, Arial, sans-serif"></text>
